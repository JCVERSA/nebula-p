name: Android (Nova)

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Nova APK
    runs-on: ubuntu-24.04  # épinglé : ubuntu-latest passe à Ubuntu 26 le 19/10/2026
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Keystore debug STABLE entre les runs (cache) : les APK successifs
      # s'installent l'un par-dessus l'autre sans désinstallation.
      - name: Cache du keystore debug
        uses: actions/cache@v6
        with:
          path: android/debug.keystore
          key: nova-debug-keystore-v1

      - name: Keystore debug si absent
        run: |
          [ -f debug.keystore ] || keytool -genkeypair -v \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Nova Debug,O=Nova,C=CM"

      - name: Build APK (debug)
        run: |
          # Le shell par défaut des steps est `bash -e -o pipefail` : sans
          # `set +e`, l'échec de gradle tuerait l'étape AVANT l'écriture du
          # résumé de diagnostic (les logs GitHub sont inaccessibles depuis
          # certains réseaux — c'est notre seul canal d'erreur).
          set +e
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Annotations ::error — SEUL canal d'erreur lisible via l'API
            # depuis cette session. 9.18i (audit B4) : SANS le motif "> "
            # qui matchait toutes les lignes « > Task » et saturait la
            # limite de 10 annotations avec des tâches, jamais l'erreur.
            grep -E "^e: |error: |FAILURE|What went wrong|Caused by|OutOfMemory|FAILED" build.log | head -n 6 | while IFS= read -r line; do
              echo "::error::${line:0:240}"
            done
            tail -n 40 build.log | grep -v "^> Task" | tail -n 4 | while IFS= read -r line; do
              echo "::error::${line:0:240}"
            done
            exit "$status"
          fi

      - name: Upload de l'APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nova-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 9.18i (audit B4) : le log de build en artifact, même en échec —
      # plan B si les annotations sont insuffisantes.
      - name: Upload du log de build (toujours)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nova-build-log
          path: android/build.log
          if-no-files-found: ignore
