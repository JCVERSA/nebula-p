name: CI
on:
  push:
    branches: [arena/01a05555-p, main]
  pull_request:
jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-24.04  # épinglé : ubuntu-latest passe à Ubuntu 26 le 19/10/2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Lint (eslint, errors only)
        run: npx eslint . --quiet
      - name: Tests (vitest)
        run: |
          # 9.18k — en cas d'échec, les NOMS des tests sont émis en
          # annotations ::error:: (les logs GitHub sont inaccessibles
          # depuis certains réseaux : seul canal de diagnostic).
          set +e
          npx vitest run --reporter=dot --reporter=json --outputFile=/tmp/vitest.json
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ -f /tmp/vitest.json ]; then
            python3 scripts/ci-vitest-annotations.py /tmp/vitest.json
          fi
          exit "$status"
