<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="Nebula Bot command flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#131a3a"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <radialGradient id="neb1" cx="0.75" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.12" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="flowC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrV" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="url(#bg)"/>
  <rect width="1200" height="660" fill="url(#neb1)"/>
  <rect width="1200" height="660" fill="url(#neb2)"/>

  <!-- stars -->
  <g fill="#e0e7ff">
    <circle cx="70" cy="150" r="1.3" opacity="0.8"/><circle cx="180" cy="100" r="1" opacity="0.55"/>
    <circle cx="255" cy="170" r="1.5" opacity="0.85"/><circle cx="420" cy="70" r="1.1" opacity="0.6"/>
    <circle cx="555" cy="130" r="1.4" opacity="0.8"/><circle cx="640" cy="60" r="1" opacity="0.5"/>
    <circle cx="760" cy="120" r="1.4" opacity="0.8"/><circle cx="1150" cy="180" r="1.2" opacity="0.7"/>
    <circle cx="1120" cy="330" r="1.4" opacity="0.75"/><circle cx="80" cy="560" r="1.3" opacity="0.7"/>
    <circle cx="240" cy="620" r="1" opacity="0.5"/><circle cx="500" cy="640" r="1.2" opacity="0.6"/>
    <circle cx="1000" cy="600" r="1.3" opacity="0.7"/><circle cx="1160" cy="520" r="1" opacity="0.55"/>
    <circle cx="320" cy="590" r="1.1" opacity="0.6"/><circle cx="880" cy="630" r="1" opacity="0.5"/>
    <path d="M 1085 90 l 1.8 4.4 4.7 0.4 -3.6 3.1 1.1 4.6 -4 -2.5 -4 2.5 1.1 -4.6 -3.6 -3.1 4.7 -0.4 z" fill="#fde68a" opacity="0.85"/>
    <path d="M 300 80 l 1.6 3.9 4.2 0.35 -3.2 2.8 1 4.1 -3.6 -2.2 -3.6 2.2 1 -4.1 -3.2 -2.8 4.2 -0.35 z" fill="#bae6fd" opacity="0.8"/>
  </g>

  <!-- ======================= TITLE ======================= -->
  <text x="60" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="7" fill="url(#title)">COMMAND FLOW</text>
  <text x="62" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#94a3b8">How a WhatsApp command travels through the Nebula engine</text>

  <!-- ======================= PANEL (supervisor) ======================= -->
  <g>
    <rect x="828" y="42" width="322" height="94" rx="14" fill="#111631" fill-opacity="0.85" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.4"/>
    <rect x="828" y="42" width="322" height="94" rx="14" fill="none" stroke="#a78bfa" stroke-opacity="0.18" stroke-width="5" filter="url(#glow)"/>
    <text x="852" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#e0e7ff">CONTROL PANEL</text>
    <text x="852" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a5b4fc">supervisor + N isolated engine processes</text>
    <text x="852" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8">pair · start / stop · monitor · update</text>
    <rect x="1082" y="52" width="56" height="20" rx="10" fill="#0e7490" fill-opacity="0.35" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="1110" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#67e8f9">8.75</text>
  </g>
  <!-- panel watches engine -->
  <path d="M 990 136 L 990 196" fill="none" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrV)"/>
  <text x="1000" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#c4b5fd">watches</text>

  <!-- ======================= PHONE ======================= -->
  <g>
    <rect x="70" y="250" width="152" height="252" rx="26" fill="url(#phoneBody)" stroke="#475569" stroke-width="1.6"/>
    <rect x="70" y="250" width="152" height="252" rx="26" fill="none" stroke="#22d3ee" stroke-opacity="0.12" stroke-width="6" filter="url(#glow)"/>
    <rect x="118" y="262" width="56" height="7" rx="3.5" fill="#334155"/>
    <circle cx="146" cy="486" r="9" fill="#0b1026" stroke="#475569"/>
    <!-- outgoing command bubble -->
    <rect x="84" y="288" width="126" height="34" rx="10" fill="#0e7490" fill-opacity="0.9"/>
    <text x="98" y="309" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#e0f7ff">.a solo leveling</text>
    <text x="98" y="322" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#e0f7ff">vf 1-12 r1</text>
    <!-- typing dots -->
    <circle cx="105" cy="352" r="2.5" fill="#64748b"/><circle cx="116" cy="352" r="2.5" fill="#64748b"/><circle cx="127" cy="352" r="2.5" fill="#64748b"/>
    <!-- incoming reply bubble -->
    <rect x="86" y="376" width="122" height="76" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="98" y="398" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#e2e8f0">📦 12/12 épisodes</text>
    <text x="98" y="414" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">VF · 480P · 1 lien/ép</text>
    <text x="98" y="434" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#67e8f9">⏳ liens valables 2 h</text>
    <text x="146" y="478" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">WhatsApp</text>
  </g>

  <!-- ======================= ENGINE CONTAINER ======================= -->
  <g>
    <rect x="330" y="196" width="600" height="372" rx="18" fill="#0d1128" fill-opacity="0.72" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.6"/>
    <rect x="330" y="196" width="600" height="372" rx="18" fill="none" stroke="#7c3aed" stroke-opacity="0.14" stroke-width="6" filter="url(#glow)"/>
    <text x="360" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#e0e7ff">NEBULA ENGINE</text>
    <text x="900" y="228" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748b">Node 22 · TypeScript strict · Baileys</text>

    <!-- stage: access control -->
    <rect x="362" y="252" width="158" height="48" rx="24" fill="#1a1030" stroke="#fb7185" stroke-opacity="0.55" stroke-width="1.3"/>
    <text x="441" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#fecdd3">Access control</text>
    <text x="441" y="289" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#94a3b8">owner · group ACL</text>

    <path d="M 524 276 L 570 276" fill="none" stroke="url(#flowC)" stroke-width="2" marker-end="url(#arrA)"/>

    <!-- stage: command registry -->
    <rect x="574" y="252" width="176" height="48" rx="24" fill="#1a1030" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.3"/>
    <text x="662" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#fde68a">Command registry</text>
    <text x="662" y="289" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#94a3b8">18 commands · sandboxed</text>

    <!-- registry → anime pipeline -->
    <path d="M 610 304 C 575 335, 540 330, 505 348" fill="none" stroke="url(#flowC)" stroke-width="2" marker-end="url(#arrA)"/>
    <!-- registry → AI -->
    <path d="M 715 304 C 740 328, 755 325, 772 344" fill="none" stroke="url(#flowC)" stroke-width="2" marker-end="url(#arrA)"/>

    <!-- anime pipeline box -->
    <g>
      <rect x="362" y="352" width="272" height="186" rx="12" fill="#08131f" fill-opacity="0.9" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="380" y="378" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#67e8f9">ANIME PIPELINE — .a</text>
      <rect x="380" y="392" width="236" height="26" rx="7" fill="#0b1026" fill-opacity="0.9"/>
      <circle cx="394" cy="405" r="7" fill="#164e63"/><text x="394" y="409" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#67e8f9">1</text>
      <text x="408" y="409" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#cbd5e1">search the chosen source</text>
      <rect x="380" y="424" width="236" height="26" rx="7" fill="#0b1026" fill-opacity="0.9"/>
      <circle cx="394" cy="437" r="7" fill="#164e63"/><text x="394" y="441" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#67e8f9">2</text>
      <text x="408" y="441" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#cbd5e1">season + language — VF default</text>
      <rect x="380" y="456" width="236" height="26" rx="7" fill="#0b1026" fill-opacity="0.9"/>
      <circle cx="394" cy="469" r="7" fill="#164e63"/><text x="394" y="473" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#67e8f9">3</text>
      <text x="408" y="473" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#cbd5e1">HLS segments → ffmpeg remux</text>
      <rect x="380" y="488" width="236" height="26" rx="7" fill="#0b1026" fill-opacity="0.9"/>
      <circle cx="394" cy="501" r="7" fill="#164e63"/><text x="394" y="505" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#67e8f9">4</text>
      <text x="408" y="505" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#cbd5e1">temp storage · links expire 2 h</text>
    </g>

    <!-- AI box -->
    <g>
      <rect x="674" y="348" width="232" height="118" rx="12" fill="#150f2e" fill-opacity="0.9" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="692" y="374" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#c4b5fd">AI — .ai</text>
      <rect x="692" y="388" width="90" height="30" rx="15" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.6"/>
      <text x="737" y="407" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#c7d2fe">Gemini</text>
      <path d="M 786 403 L 806 403" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrV)"/>
      <text x="796" y="394" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" fill="#8b5cf6">fallback</text>
      <rect x="810" y="388" width="80" height="30" rx="15" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.6"/>
      <text x="850" y="407" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#c7d2fe">NVIDIA NIM</text>
      <text x="692" y="442" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#94a3b8">25 s phase budget · 60 s deadline</text>
      <text x="692" y="458" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#94a3b8">vision prompts → always Gemini</text>
    </g>
  </g>

  <!-- ======================= FLOW ARROWS ======================= -->
  <!-- phone → engine -->
  <path d="M 226 292 C 280 288, 300 278, 356 272" fill="none" stroke="url(#flowC)" stroke-width="2.4" filter="url(#glow)" marker-end="url(#arrA)"/>
  <text x="277" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#7dd3fc">Baileys socket</text>

  <!-- engine → phone (reply) -->
  <path d="M 358 470 C 310 480, 280 478, 228 462" fill="none" stroke="#67e8f9" stroke-opacity="0.9" stroke-width="2.4" filter="url(#glow)" marker-end="url(#arrA)"/>
  <text x="277" y="534" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">document + links</text>

  <!-- footer -->
  <text x="600" y="636" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">one deployment · supervisor + engine processes · per-bot session &amp; persona · auto-reconnect</text>
</svg>
